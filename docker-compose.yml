services:

  mongodb:
    image: mongo:8
    container_name: refund-ai-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-refundai}

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - refund-ai-network


  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: refund-ai-seed

    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_HOST:-mongodb}:27017/${MONGO_DATABASE:-refundai}

    depends_on:
      mongodb:
        condition: service_healthy

    command: ["npm", "run", "seed"]

    networks:
      - refund-ai-network

    restart: "no"


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: refund-ai-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_HOST:-mongodb}:27017/${MONGO_DATABASE:-refundai}
      CLIENT_URL: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY}

    ports:
      - "5000:5000"

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - refund-ai-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/v1

    container_name: refund-ai-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - refund-ai-network


volumes:
  mongodb_data:


networks:
  refund-ai-network:
    driver: bridge